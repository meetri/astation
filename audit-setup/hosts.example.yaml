# The hosts this network audits. Copy to `audit-setup/hosts.yaml` and fill in.
#
# `audit-setup/hosts.yaml` is GITIGNORED -- it holds LAN addresses and logins, which
# are owner-specific and never belong in a tracked file (CLAUDE.md). This
# example is the reference for the shape.
#
# One entry per monitored host. The `label` is the identity that appears in
# every event row and in every S3 key (`raw/<class>/host=<label>/...`), so it
# must be stable for the life of the host: renaming one splits its history.
#
# Used by:
#   scripts/deploy_audit.sh    -- ships and installs the sensor bundle
#   scripts/audit_heartbeat.py -- alarms when a host stops shipping
#
# Adding host number four is: one entry here, then
#   scripts/deploy_audit.sh <label>
# and nothing else. That is the whole point of the file.

collector:
  # The one host that runs ClickHouse. Every other host ships its rows here for
  # querying, and its own archive to S3 independently -- so losing the
  # collector costs queryability, never the record.
  label: hermes

# Every address below is a PLACEHOLDER, in the range this repo reserves for
# examples (CLAUDE.md). Real addresses live only in the gitignored hosts.yaml.
hosts:
  - label: hermes
    ssh: user@192.168.1.20          # user@host for ssh/scp
    role: collector                 # collector = tetragon+vector+clickhouse
    notes: The agent host. Its container has the Docker socket mounted.

  - label: gpubox
    ssh: user@192.168.1.30
    role: sensor                    # sensor = tetragon+vector, ships to the collector
    ssh_key: ~/.ssh/some_key        # optional, when it is not the default key
    clickhouse_endpoint: http://192.168.1.20:8124   # how THIS host reaches the collector
    notes: Disk runs tight here -- watch the buffer.

  - label: buildbox
    ssh: user@192.168.1.40
    role: sensor
    clickhouse_endpoint: http://192.168.1.20:8124
