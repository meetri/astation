[alembic]
# Migration scripts live in the top-level `migrations/` dir at the repo root
# (../../migrations relative to this file, which lives in
# services/research-gateway/), per the layout in docs/ARCHITECTURE.md §17.
script_location = %(here)s/../../migrations

# Timezone-aware revision file timestamps.
timezone = UTC

prepend_sys_path = .

# sqlalchemy.url is intentionally left unset here — env.py builds it at
# runtime from Settings.research_gateway_db_path (repo-root .env), so the
# same DB path config used by the FastAPI app is the one migrations run
# against.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
